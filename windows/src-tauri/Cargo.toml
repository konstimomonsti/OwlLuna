[package]
name = "owlluna"
version = "0.1.0"
description = "OwlLuna for Windows: handwritten notes, an unofficial port of the iPad app"
authors = ["OwlLuna contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "owlluna_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-collections = "0.3"
windows-future = "0.3"
windows = { version = "0.62", features = [
  "Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr",
  "Security_Credentials_UI", "Storage_Streams", "UI_Input_Inking",
  "Win32_Foundation", "Win32_Storage_EnhancedStorage", "Win32_System_Com",
  "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_WinRT",
  "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
